[package]
name = "faultloom-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Fail-closed target egress kernel for FaultLoom"
license = "Apache-2.0"
publish = false

[lib]
name = "faultloom_gateway"
path = "src/lib.rs"

[[bin]]
name = "faultloom-gateway"
path = "src/main.rs"

[dependencies]
base64 = { version = "=0.22.1", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
