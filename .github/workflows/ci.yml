name: core-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INDEX: "1"
  UV_OFFLINE: "1"
  CARGO_NET_OFFLINE: "true"

jobs:
  offline-build-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: "${{ github.repository }}"
          ref: "${{ github.sha }}"
          path: .
          clean: true
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Provision the pinned Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        env:
          PIP_NO_INDEX: "0"
        with:
          python-version-file: .python-version
          cache: ""
          check-latest: false

      - name: Provision the pinned Rust runtime
        env:
          RUST_VERSION: "1.96.1"
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Verify policy and reproduce artifacts without package downloads
        env:
          FAULTLOOM_RUST_TOOLCHAIN: "1.96.1"
        run: python3 tools/verify_clean_checkout.py

  required-runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: "${{ github.repository }}"
          ref: "${{ github.sha }}"
          path: .
          clean: true
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Provision the pinned Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        env:
          PIP_NO_INDEX: "0"
        with:
          python-version-file: .python-version
          cache: ""
          check-latest: false

      - name: Install pinned test dependencies (network-enabled)
        env:
          PIP_NO_INDEX: "0"
          PIP_INDEX_URL: https://pypi.org/simple
          UV_OFFLINE: "0"
        run: python3 -m pip install --requirement requirements-dev.lock

      - name: Run the required runtime tests
        run: python3 -m pytest tests/runtime/test_personal_campaign.py tests/runtime/test_personal_campaign_bridge.py tests/runtime/test_personal_campaign_supervise.py tests/runtime/test_model_http1_poc_supervisor.py tests/runtime/test_campaign_verification_handoff.py tests/runtime/test_independent_http1_verification.py tests/runtime/test_authenticated_bola_canary.py tests/runtime/test_bola_read_semantics.py tests/runtime/test_bola_read_cli.py

  public-history-secret-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision and complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: "${{ github.repository }}"
          ref: "${{ github.sha }}"
          path: .
          clean: true
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Verify the current public tree
        run: python3 tools/check_public_tree.py .

      - name: Scan complete public history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITLEAKS_CONFIG: ".gitleaks.toml"
          GITLEAKS_VERSION: "8.21.2"
